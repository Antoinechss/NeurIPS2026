# Phase config — a native `benchopt run --config` file plus one competition
# key (`scoring`) read by the scoring program and stripped by ingestion.
# Inference only: submissions ship trained weights, so the worker stages a
# single training user.
objective:
  - EMG-pose[training=False]
dataset:
  - EMG2Pose[n_train_subjects=1]
seed: 42
no_timeout: true
scoring:
  # leaderboard key (competition.yaml) -> results column (objective output)
  columns:
    angular_mae: objective_angular_mae_public
    angular_mae_subject_std: objective_angular_mae_subject_std_public
    r2: objective_r2_public
    angular_mae_private: objective_angular_mae_private
    angular_mae_subject_std_private: objective_angular_mae_subject_std_private
    r2_private: objective_r2_private
